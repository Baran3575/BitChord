name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.10.1)'
        required: true
        default: 'v1.10.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify release signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required so all fork releases share a consistent signing key for in-place updates without reinstalling."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Secrets (Keystore & local.properties)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - run: chmod +x gradlew

      - name: Build Signed Phone Release APKs (arm64-v8a & armeabi-v7a)
        run: ./gradlew assembleProdRelease -Pbitchord.bundleWear=false

      - name: Package Release Assets
        id: pkg
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets

          # Match AppUpdateChecker.apkAssetUrl naming:
          # BitChord-vX_<abi>.apk (arm64-v8a & armeabi-v7a only)
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            base=$(basename "$apk")
            for abi in arm64-v8a armeabi-v7a; do
              if [[ "$base" == *"$abi"* ]]; then
                cp "$apk" "release-assets/BitChord-${TAG}_${abi}.apk"
              fi
            done
          done

          ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: BitChord ${{ steps.pkg.outputs.tag }}
          body_path: CHANGELOG.md
          files: release-assets/*.apk
