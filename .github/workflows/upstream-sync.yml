name: Upstream Sync

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main2
        uses: actions/checkout@v4
        with:
          ref: Main2
          fetch-depth: 0

      - name: Fetch upstream BitChord
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kushagrasinghx/BitChord.git
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Main2 is $BEHIND commits behind upstream/main."

      - name: Merge upstream into sync branch
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          git checkout -B sync/upstream-main
          set +e
          git merge --no-commit --no-ff upstream/main
          MERGE_EXIT=$?
          set -e

          if [ "$MERGE_EXIT" -ne 0 ]; then
            # Keep fork-owned changelog cleanly if conflicted
            if git diff --name-only --diff-filter=U | grep -qx "CHANGELOG.md"; then
              git checkout --ours -- CHANGELOG.md
              git add CHANGELOG.md
            fi

            # Recompute remaining unresolved files
            REMAINING=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAINING" ]; then
              echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
              echo "conflicts<<EOF" >> "$GITHUB_OUTPUT"
              echo "$REMAINING" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              # Commit with conflict markers on sync branch or abort? Abort and report cleanly
              # so Main2 is never polluted and maintainers can resolve safely.
              git merge --abort
              exit 0
            fi
          fi

          echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          git commit -m "chore(sync): merge upstream/main ($UPSTREAM_SHA) into Main2"
          git push --force-with-lease origin sync/upstream-main

      - name: Open or update sync Pull Request
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.has_conflicts == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          EXISTING=$(gh pr list --base Main2 --head sync/upstream-main --state open --json number -q '.[0].number')
          BODY="Automated sync of \`kushagrasinghx/BitChord@main\` (\`$UPSTREAM_SHA\`, ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/Main2...sync/upstream-main).\n\nAll fork customizations (BetterLyrics, UI upgrades, fork updater) are preserved without conflicts."
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "chore(sync): merge upstream/main ($UPSTREAM_SHA)" --body "$BODY"
          else
            gh pr create --base Main2 --head sync/upstream-main --title "chore(sync): merge upstream/main ($UPSTREAM_SHA)" --body "$BODY"
          fi

      - name: Report upstream merge conflict
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.has_conflicts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Upstream sync found conflicts in: ${{ steps.merge.outputs.conflicts }}"
          exit 1
